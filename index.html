.brand-lockup:is(:hover,:focus-visible):after{transform:scaleX(1)}}
.brand-lockup:focus-visible:after{transform:scaleX(1)}@media (hover:hover) and (pointer:fine){

:root{--serif:'Studio Serif SC','Songti SC',serif;--ease-settle:cubic-bezier(.22,.61,.36,1)}
/* Quiet, reversible edge feedback replaces the borrowed perpetual sweep. */
.hover-border{inset:0;padding:0;mask:none;-webkit-mask:none;border:1px solid currentColor;opacity:0;transform:scale(.985);transition:opacity .3s var(--ease-settle),transform .3s var(--ease-settle);color:inherit;background:none;box-shadow:none}
.hover-border:before{content:none!important;animation:none!important}@media (hover:hover) and (pointer:fine){
.hover-target:is(:hover,:focus-visible)>.hover-border,.case-card:is(:hover,:focus-visible) .case-cover>.hover-border{opacity:.22;transform:scale(1)}}
.hover-target:focus-visible>.hover-border,.case-card:focus-visible .case-cover>.hover-border{opacity:.22;transform:scale(1)}
.button,.case-card,.nav-link,.service-item,.cooperation-item,.carousel-controls button,.poster-filters button,.swap-presets button,.contact-method button{transition:background-color .28s var(--ease-settle),color .28s var(--ease-settle),border-color .28s var(--ease-settle),box-shadow .28s var(--ease-settle)}@media (hover:hover) and (pointer:fine){
.button:is(:hover,:focus-visible){box-shadow:none}}
.button:focus-visible{box-shadow:none}
a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex="0"]:focus-visible{outline:1.5px solid var(--blue);outline-offset:5px}
.sidebar a:focus-visible,.sidebar button:focus-visible,.cooperation-band a:focus-visible{outline-color:var(--paper)}
button:disabled>.hover-border{opacity:0!important}
.image-button .hover-border{display:none}
.button{min-height:40px;padding:10px 16px;gap:24px}
.swap-presets{gap:12px;padding-top:22px}
.swap-presets button{padding:10px 15px;min-height:38px;border:1px solid var(--line);border-radius:3px;background:transparent;line-height:1.5}@media (hover:hover) and (pointer:fine){
.swap-presets button:hover{border-color:#0000f260;background:#0000f207}}
.poster-filters button{padding:9px 13px;min-height:36px;line-height:1.5}
.quantity-control button{width:32px;height:32px}
.carousel-controls button{position:relative}
.plan-card:focus-visible{outline-offset:5px}

/* Shared Chinese title family, weight, baseline and 78% visual width. */
.section-heading h2.home-section-title,.honors-section .section-heading h2.home-section-title{font:500 36px/1.45 var(--serif);letter-spacing:0;width:calc(var(--title-chars) * .78em);white-space:nowrap;flex:none}
.home-section-title>span{display:block;width:max-content;transform:scaleX(.78);transform-origin:left center}
.section-heading{align-items:baseline;margin-bottom:28px}
.offer-hero .offer-title h1,.category-tag,.case-heading h1,.contact-intro h1,.series-intro h2,.cooperation-grid .cooperation-copy h2,.cooperation-item h3{font-family:var(--serif);font-weight:500;font-synthesis:none}
.offer-hero .offer-title h1>span{transform:scaleX(.78)}
.offer-hero .offer-title h1{width:3.12em}
.cooperation-grid .cooperation-copy h2{letter-spacing:-.02em}
.services-section{padding-bottom:58px}
.service-stage{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:38px;align-items:stretch}
.service-composition{align-self:stretch;height:100%;width:100%;max-width:none}
.service-art{height:100%;aspect-ratio:auto;min-height:420px;background:var(--blue)}
.service-art .art-image{object-fit:cover;object-position:center;width:100%;height:100%;max-width:none}
.service-list{border-top:1px solid var(--line);display:grid;grid-template-rows:repeat(5,minmax(0,1fr))}
.service-list .service-item{min-height:88px;padding:17px 10px;align-items:center}
.service-list .service-item>.icon{margin-top:0;align-self:center}
.service-no{margin-top:0;align-self:center}

/* Optical grouping and the same center axis for client marks and honors. */
.client-wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:12px 4px 10px}
.client-cell{height:96px;padding:20px 14px;display:flex;align-items:center;justify-content:center}
.client-cell img{width:auto!important;height:auto!important;max-width:min(var(--logo-width),100%)!important;max-height:var(--logo-height)!important;object-fit:contain;filter:brightness(0);mix-blend-mode:multiply}
.client-more{border-top:1px solid var(--line);display:grid;grid-template-columns:146px minmax(0,1fr);gap:20px;padding:20px 4px 0;margin-top:9px;font:400 11px/1.9 var(--sans);color:var(--muted)}
.client-more>span{color:var(--ink);white-space:nowrap}
.client-more p{margin:0;text-wrap:pretty}
.client-more-brands{display:flex;flex-wrap:wrap;gap:7px 22px;min-width:0}
.client-more-brands>span{display:block;max-width:100%;text-wrap:pretty}
.clients-section{padding-bottom:39px}
.honors-section .section-heading{padding-top:28px;margin-bottom:28px}
.honors-list{gap:0;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 4px}
.honor-record,.honor-record:last-child{padding:0 15px;border:0;text-align:center;align-items:center}
.honor-record+.honor-record{border-left:1px solid var(--line)}
.honor-logo{height:80px;justify-content:center;margin-bottom:18px;overflow:hidden}
.honor-logo img{position:static;left:auto;max-width:130px;max-height:64px;margin:auto;flex:none}
.honor-record[data-award=digitaling] .honor-logo img{position:static;left:auto;width:194px;max-width:none}
.honor-record h3{line-height:1.75;font-size:12px;margin-bottom:7px;text-align:center;width:100%}
.honor-record p{line-height:1.8;font-size:11px;text-align:center;width:100%}
.honors-section{padding-bottom:54px}

/* A chapter masthead: index, title, discipline, diagram and three scope lines. */
.chapter-heading{display:block;padding:26px 0 28px;margin:0 0 8px}
.chapter-topline{display:flex;justify-content:space-between;gap:18px;font:400 9px/1.5 var(--mono);letter-spacing:.035em;color:var(--muted);margin-bottom:22px}
.chapter-topline>span:first-child{color:var(--blue)}
.chapter-heading-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.9fr) 82px;align-items:center;gap:28px;min-height:100px}
.category-english{font:400 clamp(44px,5.5cqw,66px)/1.02 var(--gothic);letter-spacing:-.012em;max-width:none;text-wrap:balance;margin:0}
.chapter-chinese{border:0;padding:0;align-self:center}
.chapter-chinese .category-tag{font:500 35px/1.4 var(--serif);letter-spacing:0;transform:none;display:block;width:3.12em}
.chapter-chinese .category-tag>span{display:block;width:max-content;transform:scaleX(.78);transform-origin:left center;white-space:nowrap}
.chapter-chinese .chapter-statement{font:400 12px/1.85 var(--sans);margin-top:11px;max-width:285px;color:var(--muted)}
.chapter-emblem{width:82px;height:82px;color:var(--blue);opacity:.7}
.emblem-faint{opacity:.4}
.chapter-scope{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:23px;padding-top:14px;gap:16px;font:400 10px/1.6 var(--sans);color:var(--muted)}
.chapter-scope>span{display:flex;gap:13px;align-items:baseline}
.chapter-scope small{font:400 8px/1.4 var(--mono);color:var(--blue);opacity:.65}
.case-heading-meta .category-tag{border-left:1px solid var(--line);padding-left:18px;transform:none;font:400 11px/1.5 var(--sans);letter-spacing:0}
.case-heading-meta .category-tag>span{transform:none}
.case-heading{padding-top:26px;padding-bottom:27px;margin-bottom:28px}
.case-heading h1{font-family:var(--serif);font-weight:500;line-height:1.45;letter-spacing:-.025em;text-wrap:pretty;margin-bottom:13px}
.case-service{margin-bottom:23px}
.case-story{display:grid;grid-template-columns:minmax(0,1fr) 155px;gap:44px;align-items:start;max-width:100%}
.case-story-copy{max-width:780px}
.case-description,.case-approach{font:400 13px/1.95 var(--sans);color:var(--muted);margin:0;text-wrap:pretty;max-width:none}
.case-approach{margin-top:13px}
.case-capabilities{padding-left:21px;border-left:1px solid var(--line);min-width:0}
.case-capabilities>span{font:400 9px/1.5 var(--mono);color:var(--faint);display:block;margin-bottom:10px}
.case-capabilities ul{list-style:none;padding:0;margin:0;font:400 11px/1.85 var(--sans);color:var(--ink)}
.case-capabilities li+li{margin-top:4px}

/* Case artwork stays whole, with enlargement chosen per finished piece. */
.art-view{display:block;width:100%;min-width:0;line-height:0;position:relative}
.art-view>img{display:block;width:100%;height:auto;max-width:100%;filter:none;mix-blend-mode:normal}
div.art-view{cursor:default}
.image-button.art-view:focus-visible{outline-offset:4px}
.gallery-grid.proposal-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px;align-items:start}
.proposal-pages .work-figure{margin:0;width:100%}
.proposal-pages .work-figure>.art-view{background:#fff;border:1px solid #0000610c}
.proposal-pages .work-figure figcaption{font-size:10px;line-height:1.65;margin-top:10px;color:var(--muted)}
.gallery-pair-rows{display:grid;gap:25px}
.project-page[data-case=B03] .gallery-section>h2{margin-bottom:13px}
.gallery-description{max-width:640px;margin-bottom:24px}
.case-cover[data-cover-case=C07]{aspect-ratio:16/9}
[data-category=campaign] .case-cover{aspect-ratio:16/9}
[data-category=campaign] .case-cover>img{object-fit:contain;width:100%;height:100%}
.project-media .media-figure[data-format=landscape]{max-width:1000px;margin:auto}
.project-media .media-figure[data-video-quality=low]{max-width:360px}
.interface-flow{max-width:860px;align-items:start}
.interface-flow>.media-figure,.interface-flow>.ui-still{width:auto;max-width:100%;justify-self:center}
.interface-flow>.media-figure>video{height:min(470px,55svh);width:auto;max-width:100%;object-fit:contain;background:transparent}
.interface-flow>.ui-still>.ui-screen{height:min(470px,55svh);width:auto;max-width:100%;margin-inline:auto}

/* Small poster collections share the same footprint as single poster cards. */
.poster-wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 24px;columns:auto;align-items:start}
.poster-wall>[hidden]{display:none!important}
.poster-entry{min-width:0;margin:0;break-inside:auto}
.poster-entry>.image-button,.poster-entry>.poster-video{aspect-ratio:3/4;background:var(--wash);display:flex;justify-content:center;align-items:center;padding:16px;width:100%;margin:0}
.poster-entry>.image-button>img,.poster-entry>.poster-video>video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;filter:none;mix-blend-mode:normal}
.poster-entry>.image-button>.image-affordance{bottom:10px;right:10px}
.poster-caption{padding:13px 2px 0}
.poster-caption h3{font:500 13px/1.65 var(--sans);letter-spacing:-.02em;margin:0 0 5px;color:var(--ink)}
.poster-caption p{font:400 10px/1.7 var(--sans);margin:0;color:var(--muted);gap:12px;display:flex;justify-content:space-between}
.poster-caption .collection-description{display:block;font:400 11px/1.8 var(--sans);margin-top:9px;max-width:96%}
.collection-related{display:inline-flex;align-items:center;gap:13px;font:400 10px/1.6 var(--sans);margin-top:10px;color:var(--blue)}
.collection-related .icon{width:12px;height:12px}
.compact-carousel{width:100%;border:1px solid var(--line);background:var(--wash)}
.compact-carousel .carousel-viewport{height:auto;aspect-ratio:3/4}
.compact-carousel .carousel-slide{padding:16px}
.carousel-slide .art-view{height:100%;display:flex;align-items:center;justify-content:center;width:100%}
.carousel-slide .art-view>img{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.compact-carousel .carousel-footer{padding:8px 9px;gap:8px;align-items:center}
.compact-carousel .carousel-caption{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:9px;line-height:1.5}
.compact-carousel .carousel-counter{font-size:9px;line-height:1.5}
.compact-carousel .carousel-current-label{max-width:100%;font-size:9px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;min-height:14px}
.compact-carousel .carousel-controls{gap:5px}
.compact-carousel .carousel-controls button{width:29px;height:29px;border:0;background:transparent;border-radius:2px}@media (hover:hover) and (pointer:fine){
.compact-carousel .carousel-controls button:hover{background:#0000f20b;color:var(--blue)}}
.compact-carousel .carousel-controls .icon{width:13px;height:13px}
.compact-carousel .carousel-dots{display:none}
.compact-carousel .carousel-slide .image-affordance{right:0;bottom:0;padding:4px;border:0;opacity:0;transition:opacity .2s}@media (hover:hover) and (pointer:fine){
.compact-carousel .carousel-slide .image-button:is(:hover,:focus-visible) .image-affordance{opacity:1}}
.compact-carousel .carousel-slide .image-button:focus-visible .image-affordance{opacity:1}
.carousel-gallery{max-width:780px;margin-inline:auto}
.carousel-gallery .carousel-viewport{height:min(63svh,520px)}
.carousel-gallery .carousel-slide{padding:24px}

/* One WeChat group, two IDs, and a readable address. */
.contact-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:28px;padding:26px 0;align-items:start}
.contact-row>span:first-child{font:400 12px/1.7 var(--sans);color:var(--muted);padding-top:9px;grid-column:auto}
.contact-values{display:grid;gap:21px;min-width:0}
.contact-method{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:22px}
.contact-method .contact-value{font:400 20px/1.55 var(--mono);overflow-wrap:anywhere;color:var(--ink)}
.contact-method button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);background:transparent;border-radius:3px;padding:9px 12px;color:var(--blue);font:400 11px/1.5 var(--sans);min-height:36px;flex:none}
.contact-method button>.icon{width:14px;height:14px}@media (hover:hover) and (pointer:fine){
.contact-method button:hover{background:#0000f207;border-color:#0000f250}}
.contact-address p{font:400 14px/1.95 var(--sans);margin:4px 0;color:var(--ink);text-wrap:pretty}

.handset{width:min(100%,250px);min-width:0;margin:0;justify-self:center}
.handset-body{position:relative;width:100%;aspect-ratio: .485;padding:8px;border-radius:43px;background:linear-gradient(120deg,#737577 0,#111214 8%,#020203 45%,#44464a 85%,#0b0c0d);box-shadow:0 12px 26px #10101c15,inset 0 0 0 1px #707176,inset 0 0 0 3px #1c1d1f;isolation:isolate}

.handset-body:before{top:17%;height:8%}
.handset-body:after{top:28%;height:11%}

.handset-home{pointer-events:none;position:absolute;z-index:4;bottom:7px;left:33%;width:34%;height:3px;border-radius:3px;background:#171719;box-shadow:0 0 1px #ffffff50}

/* R23 — compact shared navigation and a quieter, responsive studio overview.
   Case covers and project spreads are unchanged; poster refinements are scoped below. */

/* Marks share optical sizing rather than an identical bounding-box width. */
#content .clients-section .client-wall{grid-template-columns:repeat(5,minmax(0,1fr));gap:0;padding:0;margin:0}
#content .clients-section .client-cell{height:76px;min-height:0;padding:16px 12px;border:0!important}
#content .clients-section .client-cell img{width:auto!important;height:auto!important;max-width:min(calc(var(--logo-width,120px) * .9),100%)!important;max-height:calc(var(--logo-height,32px) * .9)!important;object-fit:contain;opacity:1;filter:none;mix-blend-mode:normal}
#content .clients-section .client-continuation{font-size:24px;letter-spacing:3px;padding:12px;color:var(--muted);opacity:.65}

/* Let the biography use the same right edge as its section heading. */
#content #team .person-bio{max-width:none;text-wrap:wrap}
#content #team .person-bio .person-bio-text{margin:0;text-wrap:wrap;line-height:1.95}
#content #team .person-bio .bio-segment{display:inline}
#content #team .person-bio .bio-desktop-break{display:block;margin-top:5px}

/* Both ending actions are buttons; the secondary fill keeps the hierarchy calm. */
#content .closing-cta .end-actions{gap:12px}
#content .closing-cta .button{min-height:44px;gap:18px;white-space:nowrap;border-radius:3px;box-shadow:none}
#content .closing-cta .button-primary{background:var(--blue);border-color:var(--blue);color:var(--paper)}
#content .closing-cta .button-secondary-solid{background:#e7e7f1;border-color:#d5d5e4;color:var(--blue);--hover-ink:var(--blue);--hover-tail:#aaaaf2}
#content .closing-cta .button .icon{flex:none;width:15px;height:15px}

/* One copyright line and two small service tabs, aligned to the page gutter. */
.site-footer{padding:20px var(--gutter);padding-right:var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:18px;font:400 10px/1.5 var(--mono)}
.site-footer .copyright{color:var(--muted);letter-spacing:.01em;white-space:nowrap}
.site-footer .footer-offers{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:9px}
.site-footer .footer-tag{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:21px;min-height:35px;padding:7px 10px;border:1px solid #d8d8e4;border-radius:2px;background:#eaeaf1;color:var(--blue);font:400 11px/1.5 var(--sans);white-space:nowrap;text-decoration:none;transition:background-color 140ms,color 140ms,border-color 140ms}
.site-footer .footer-tag .icon{width:12px;height:12px;flex:none}
.site-footer .footer-tag[aria-current=page]{border-color:#b6b6d5;background:#dedeee}
.site-footer .footer-tag:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* Float above the footer actions instead of competing with them at the edge. */
#back-to-top{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:36px;height:36px;border-radius:2px;border-right:1px solid var(--line);box-shadow:none}

@media (hover:hover) and (pointer:fine){
 #content .closing-cta .button-primary:hover{background:#0900d9;border-color:#0900d9;color:var(--paper)}
 #content .closing-cta .button-secondary-solid:hover{background:#dbdbef;border-color:#bdbddb;color:var(--blue)}
 .site-footer .footer-tag:hover{background:#ddddef;border-color:#bdbddd;color:var(--blue)}
}

/* Retain the artwork's layout while waiting; never expose native broken-image text. */

img[data-visual]:not([data-media-state="ready"]),

img[data-studio-logo]:not([data-media-state="ready"]){visibility:hidden}

/* R24: only the newly requested campaign arrangements. */
#content .project-page .project-media .film-feature-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start;width:100%;max-width:980px;margin:0;
}
#content .project-page .film-feature-grid>.media-figure{width:100%;max-width:none;min-width:0;margin:0}

/* Two full KVs in their own rows, with their original proportions intact. */
#content .project-page .gallery-grid.stacked-wide{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;max-width:none;margin-inline:0}

function hydrateFruitArticle(scope=document){
 scope.querySelectorAll('[data-fruit-travel]').forEach(root=>{
  if(root.dataset.bound)return;root.dataset.bound='true';
  const track=root.querySelector('.fruit-travel-track'),slides=[...track.children],buttons=[...root.querySelectorAll('[data-fruit-step]')];
  let index=0;
  const sync=()=>{index=Math.max(0,Math.min(slides.length-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));root.querySelector('.fruit-travel-counter').textContent=String(index+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');buttons.forEach(b=>b.disabled=Number(b.dataset.fruitStep)<0?index===0:index===slides.length-1);};
  const step=delta=>{const next=Math.max(0,Math.min(slides.length-1,index+delta));slides[next].querySelectorAll('img').forEach(img=>requestDisplayImage(img,{priority:-1}));index=next;track.scrollTo({left:next*track.clientWidth,behavior:motionMedia.matches?'instant':'smooth'});};
  buttons.forEach(b=>b.addEventListener('click',()=>step(Number(b.dataset.fruitStep))));
  track.addEventListener('scroll',sync,{passive:true});track.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();step(e.key==='ArrowRight'?1:-1);}});sync();
 });
}

function syncBackTop(){const b=document.getElementById('back-to-top');if(b)b.hidden=scrollY<320||imageDialog.open||rail.classList.contains('mobile-open');}
backTop.onclick=()=>{content.focus({preventScroll:true});scrollTo({top:0,behavior:motionMedia.matches?'instant':'smooth'});};
let scrollQueued=false;addEventListener('scroll',()=>{if(!scrollQueued){scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;syncBackTop();});}},{passive:true});
window.addEventListener('hashchange',render);window.addEventListener('resize',()=>{if(desktopMedia.matches)closeMobile(false);else syncRail();if(imageDialog.open)fitImage();document.querySelectorAll('[data-carousel]').forEach(root=>{if(root.classList.contains('peek-carousel'))return;const track=root.querySelector('.carousel-viewport');track.scrollTo({left:Number(root.dataset.index)*track.clientWidth,behavior:'instant'});});});
motionMedia.addEventListener('change',()=>{if(motionMedia.matches)document.querySelectorAll('video[data-autoplay]').forEach(v=>v.pause());});
window.portfolio={render,showImage,cases:DATA.cases,chapters:DATA.chapters};syncRail();render();
</script></body></html>
